name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  awesome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes awesome-lint@2.3.0 README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
